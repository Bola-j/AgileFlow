<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgileFlow</title>
    <meta name="description" content="Log in to AgileFlow to manage your agile projects and collaborate with your team.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f5f7;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.09);
            background: #fff;
        }
        .brand { font-weight: 800; color: #4f46e5; font-size: 1.1rem; letter-spacing: -0.02em; }
        #login-alert { display: none; }

        /* Resend verification banner */
        #resend-verification-banner {
            display: none;
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        #resend-verification-banner .banner-text {
            font-size: 0.85rem;
            color: #92400e;
            margin-bottom: 8px;
        }
        #resend-verification-btn {
            font-size: 0.82rem;
            padding: 4px 12px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand mb-3">AgileFlow</div>
        <h1 class="h4 mb-1 fw-bold">Welcome back</h1>
        <p class="text-muted small mb-4">Sign in to continue to your workspace.</p>

        <!-- Alert area -->
        <div id="login-alert"></div>

        <!-- Resend verification banner (shown when email is unverified) -->
        <div id="resend-verification-banner" role="alert">
            <p class="banner-text">
                Your email address <strong id="resend-email-display"></strong> has not been verified yet.
                Check your inbox or request a new confirmation email.
            </p>
            <button class="btn btn-warning btn-sm fw-semibold" id="resend-verification-btn">
                Resend verification email
            </button>
        </div>

        <!-- Login form -->
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label fw-medium">Email</label>
                <input type="email" class="form-control" id="email" required placeholder="name@example.com" autocomplete="email">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-medium">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" required placeholder="********" autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Show password">
                        <i class="bi bi-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3 fw-semibold" style="background:#4f46e5;border-color:#4f46e5;">
                Login
            </button>
            <div class="text-center">
                <span class="text-muted small">Don't have an account?</span>
                <a href="register.html" class="text-decoration-none small ms-1">Sign Up</a>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
