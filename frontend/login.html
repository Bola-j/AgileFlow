<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgileFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f4f5f7; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: #fff; }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="text-center mb-4">AgileFlow Login</h3>
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" required placeholder="********">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Show password">
                        <i class="bi bi-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            
            <div class="text-center">
                <span class="text-muted">Don't have an account?</span>
                <a href="register.html" class="text-decoration-none">Sign Up</a>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
