<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AgileFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f4f5f7; }
        .register-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: #fff; }
    </style>
</head>
<body>

    <div class="register-card">
        <h3 class="text-center mb-4">Create Account</h3>
        <form id="register-form">
            <div class="mb-3">
                <label for="reg-name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="reg-name" required placeholder="John Doe">
            </div>
            <div class="mb-3">
                <label for="reg-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="reg-email" required placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="reg-password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="reg-password" required placeholder="********">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-reg-password" aria-label="Show password">
                        <i class="bi bi-eye" id="toggle-reg-password-icon"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <label for="reg-confirm-password" class="form-label">Re-enter Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="reg-confirm-password" required placeholder="********">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-reg-confirm-password" aria-label="Show confirm password">
                        <i class="bi bi-eye" id="toggle-reg-confirm-password-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-3">Sign Up</button>
            
            <div class="text-center">
                <span class="text-muted">Already have an account?</span>
                <a href="login.html" class="text-decoration-none">Login</a>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
