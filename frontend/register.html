<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AgileFlow</title>
    <meta name="description" content="Create your AgileFlow account and start managing your agile projects smarter.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f5f7;
            font-family: 'Inter', sans-serif;
        }
        .register-card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.09);
            background: #fff;
        }
        .brand { font-weight: 800; color: #4f46e5; font-size: 1.1rem; letter-spacing: -0.02em; }
        #register-alert { display: none; }

        /* Check-email panel */
        #check-email-panel {
            display: none;
            text-align: center;
            padding: 8px 0;
        }
        .check-email-icon {
            width: 72px; height: 72px;
            background: rgba(79,70,229,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="brand mb-3">AgileFlow</div>
        <h1 class="h4 mb-1 fw-bold">Create Account</h1>
        <p class="text-muted small mb-4">Start managing projects with your team.</p>

        <!-- Alert area -->
        <div id="register-alert"></div>

        <!-- Registration form -->
        <form id="register-form">
            <div class="mb-3">
                <label for="reg-name" class="form-label fw-medium">Full Name</label>
                <input type="text" class="form-control" id="reg-name" required placeholder="John Doe" autocomplete="name">
            </div>
            <div class="mb-3">
                <label for="reg-email" class="form-label fw-medium">Email</label>
                <input type="email" class="form-control" id="reg-email" required placeholder="name@example.com" autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="reg-password" class="form-label fw-medium">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="reg-password" required placeholder="At least 8 characters" autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-reg-password" aria-label="Show password">
                        <i class="bi bi-eye" id="toggle-reg-password-icon"></i>
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <label for="reg-confirm-password" class="form-label fw-medium">Re-enter Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="reg-confirm-password" required placeholder="********" autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-reg-confirm-password" aria-label="Show confirm password">
                        <i class="bi bi-eye" id="toggle-reg-confirm-password-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3 fw-semibold" style="background:#4f46e5;border-color:#4f46e5;">
                Sign Up
            </button>
            <div class="text-center">
                <span class="text-muted small">Already have an account?</span>
                <a href="login.html" class="text-decoration-none small ms-1">Login</a>
            </div>
        </form>

        <!-- Check-your-email panel (shown after successful registration) -->
        <div id="check-email-panel">
            <div class="check-email-icon">✉</div>
            <h2 class="h5 fw-bold mb-2">Check your email!</h2>
            <p class="text-muted small mb-1">
                We sent a verification link to:
            </p>
            <p class="fw-semibold mb-3" id="check-email-address"></p>
            <p class="text-muted small mb-4">
                Click the link in the email to activate your account. Once confirmed, you can log in.
            </p>
            <a href="login.html" class="btn btn-outline-secondary btn-sm">Back to Login</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
