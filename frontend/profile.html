<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AgileFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="workspaces.html">AgileFlow</a>
            <div class="d-flex gap-2">
                <a href="profile.html" class="btn btn-outline-light active" aria-current="page">Profile</a>
                <button class="btn btn-danger" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <a href="workspaces.html" class="btn btn-secondary mb-3">Back to Workspaces</a>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Profile Settings</h3>
                
                <form id="profile-form">
                    <div class="mb-3">
                        <label for="profile-name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="profile-name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="profile-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="profile-email" required disabled>
                        <div class="form-text">Email cannot be changed.</div>
                    </div>
                    
                    <hr class="my-4">
                    <h5 class="mb-3">Change Password</h5>
                    
                    <div class="mb-3">
                        <label for="profile-password" class="form-label">New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="profile-password" placeholder="Leave blank to keep current password">
                            <button class="btn btn-outline-secondary" type="button" id="toggle-profile-password" aria-label="Show password">
                                <i class="bi bi-eye" id="toggle-profile-password-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="border-top pt-4 mt-4">
                        <h5 class="text-danger mb-2">Delete Account</h5>
                        <p class="text-muted mb-3">Delete your account and remove the current session from this browser.</p>
                        <button type="button" class="btn btn-outline-danger w-100" id="delete-account-btn">Delete Account</button>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
