<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspaces - AgileFlow</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="workspaces.html">AgileFlow</a>
            
            <div class="d-flex gap-2">
                <button class="btn btn-primary" id="create-workspace-btn">Create Workspace</button>
                
                <a href="profile.html" class="btn btn-outline-light">Profile</a>
                
                <button class="btn btn-danger" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Your Workspaces</h2>
        
        <div class="row" id="workspaces-container">
            </div>
    </div>

    <div class="modal fade" id="createWorkspaceModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Create New Workspace</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="workspace-form">
                        <div class="mb-3">
                            <label for="workspace-name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="workspace-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="workspace-desc" class="form-label">Description</label>
                            <textarea class="form-control" id="workspace-desc" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/workspaces.js"></script>
</body>
</html>
