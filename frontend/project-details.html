<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - AgileFlow</title>
    
    <!-- Include Bootstrap CSS library-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar-->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <!-- Clicking the logo returns to workspaces-->
            <a class="navbar-brand" href="workspaces.html">AgileFlow</a>
            <button class="btn btn-primary" id="create-project-btn">Create Project</button>
        </div>
    </nav>

    <!-- Main Container-->
    <div class="container">
        <!-- Back Button-->
        <a href="workspaces.html" class="btn btn-secondary mb-3">Back to Workspaces</a>
        
        <h2 class="mb-4">Workspace Projects</h2>
        
        <!-- Row where JS will inject the project cards-->
        <div class="row" id="projects-container">
            <!-- Cards will appear here-->
        </div>
    </div>

    <div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Create New Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="project-form">
                        <div class="mb-3">
                            <label for="project-name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="project-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="project-status" class="form-label">Status</label>
                            <select class="form-select" id="project-status">
                                <option value="To Do">To Do</option>
                                <option value="In Progress">In Progress</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/project-details.js"></script>

</body>
</html>
