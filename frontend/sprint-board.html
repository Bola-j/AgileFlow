<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Board - AgileFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        
        .board-column { background-color: #f4f5f7; border-radius: 8px; padding: 15px; min-height: 400px; }
        .task-card { cursor: pointer; transition: transform 0.2s; }
        .task-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="workspaces.html">AgileFlow</a>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" id="create-task-btn">Create Task</button>
                <a href="profile.html" class="btn btn-outline-light">Profile</a>
                <button class="btn btn-danger" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <a href="workspaces.html" class="btn btn-secondary mb-4">Back to Workspaces</a>
        
        <h2 class="mb-4">Sprint Board</h2>
        
        <div class="row">
            <div class="col-md-4 mb-3">
                <h4 class="text-secondary text-center mb-3">To Do</h4>
                <div class="board-column" id="todo-column" ondrop="drop(event, 'To Do')" ondragover="allowDrop(event)"></div>
            </div>
            
            <div class="col-md-4 mb-3">
                <h4 class="text-primary text-center mb-3">In Progress</h4>
                <div class="board-column" id="inprogress-column" ondrop="drop(event, 'In Progress')" ondragover="allowDrop(event)"></div>
            </div>
            
            <div class="col-md-4 mb-3">
                <h4 class="text-success text-center mb-3">Done</h4>
                <div class="board-column" id="done-column" ondrop="drop(event, 'Done')" ondragover="allowDrop(event)"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="task-form">
                        <div class="mb-3">
                            <label class="form-label">Task Title</label>
                            <input type="text" class="form-control" id="task-title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="task-status">
                                <option value="To Do">To Do</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sprint-board.js"></script>
</body>
</html>
