services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-AgileFlow123!}"
    ports:
      - "14333:1433"
    volumes:
      - agileflow_sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/API/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AgileFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AgileFlow123!};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Issuer: AgileFlow
      Jwt__Audience: AgileFlow
      Jwt__Key: "${JWT_KEY:-AgileFlowDockerJwtKeyForLocalE2eOnly_ChangeMe_1234567890}"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "7"
    ports:
      - "6358:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:6358
    depends_on:
      - api
    ports:
      - "5173:4173"

volumes:
  agileflow_sqlserver:
